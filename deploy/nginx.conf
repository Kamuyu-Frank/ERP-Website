# Install only after reviewing the existing bentito.com virtual host.
# Use the actual certificate paths if your certificate is stored elsewhere.
server {
    listen 80;
    server_name bentito.com;
    return 301 https://bentito.com$request_uri;
}
server {
    listen 443 ssl;
    server_name bentito.com;
    ssl_certificate /etc/letsencrypt/live/bentito.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bentito.com/privkey.pem;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
