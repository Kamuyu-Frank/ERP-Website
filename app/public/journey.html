<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapERP — Supplier to receipt</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17232d}svg{display:block;width:100%;height:100%}.maize{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><svg id="world" role="img" aria-label="Connected supplier to receipt journey"></svg><script src="/journey-scenes.js"></script><script>
window.renderJourneyChapter(0,0);
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='snaperp-journey')return;
  const p=event.data.progress;if(typeof p!=='number'||!Number.isFinite(p))return;
  const bounded=Math.max(0,Math.min(12,p)),stage=Math.min(11,Math.floor(bounded));
  window.renderJourneyChapter(stage,bounded-stage);
});
</script></body></html>
